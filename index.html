<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="İnşaat proje, şantiye, satış ve finans yönetim platformu">
  <meta name="theme-color" content="#172c52">
  <meta name="application-name" content="Yapı360">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yapı360">
  <title>Yapı360 | İnşaat Yönetim Platformu</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section class="login" id="login">
    <form class="login-card" id="loginForm">
      <div class="logo">Yapı<span>360</span></div>
      <div class="sub">İnşaat Proje ve Satış Yönetim Platformu</div>
      <div class="field"><label for="email">E-posta</label><input class="input" id="email" type="email" autocomplete="username" value="admin@yapi360.demo" required></div>
      <div class="field"><label for="pass">Şifre</label><input class="input" id="pass" type="password" autocomplete="current-password" value="123456" required></div>
      <button class="btn block" type="submit">Giriş Yap</button>
      <div class="error" id="loginError" role="alert"></div>
      <div class="demo">Demo hesap<br><b>admin@yapi360.demo</b><br>Şifre: <b>123456</b></div>
    </form>
  </section>

  <section class="app" id="app">
    <aside class="side" id="sidebar" aria-label="Ana menü">
      <h2>Yapı<span>360</span></h2>
      <nav id="nav"></nav>
    </aside>
    <main class="main">
      <header class="top">
        <div class="top-actions">
          <button class="btn ghost mobile-toggle" id="menuToggle" aria-label="Menüyü aç">☰</button>
          <div><div class="eyebrow">YÖNETİCİ PANELİ</div><h1 id="pageTitle">Genel Bakış</h1></div>
        </div>
        <div class="top-actions">
          <button class="btn gold install" id="installBtn">Uygulamayı Yükle</button>
          <span class="company">Demo İnşaat A.Ş. · Admin</span>
          <button class="btn ghost" id="logoutBtn">Çıkış</button>
        </div>
      </header>
      <p class="page-description" id="pageDescription"></p>
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </section>

  <div class="modal" id="recordModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal-card" id="recordForm">
      <div class="modal-head"><h2 id="modalTitle">Yeni Kayıt</h2><button type="button" class="close" id="closeModal" aria-label="Kapat">×</button></div>
      <div class="form-grid" id="recordFields"></div>
      <button class="btn block" type="submit">Kaydet</button>
    </form>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
