<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="İnşaat firmaları için proje, finans, şantiye ve satış yönetim platformu">
  <meta name="theme-color" content="#172c52">
  <meta name="application-name" content="Yapı360">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Yapı360">
  <title>Yapı360 | İnşaat Yönetim Platformu</title>
  <link rel="manifest" href="./manifest.webmanifest?v=4.1.0">
  <link rel="icon" href="./icon.svg?v=4.1.0" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=4.1.0">
</head>
<body>
  <section class="auth" id="auth">
    <form class="auth-card" id="authForm">
      <div class="logo">Yapı<span>360</span></div>
      <div class="sub" id="authSubtitle">Firma çalışma alanınıza giriş yapın.</div>
      <div id="setupFields" hidden>
        <div class="field"><label for="companyName">Firma adı</label><input class="input" id="companyName" name="companyName" autocomplete="organization"></div>
        <div class="field"><label for="fullName">Yönetici adı soyadı</label><input class="input" id="fullName" name="fullName" autocomplete="name"></div>
      </div>
      <div class="field"><label for="email">E-posta</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Şifre</label><input class="input" id="password" name="password" type="password" minlength="6" autocomplete="current-password" required></div>
      <button class="btn block" id="authSubmit" type="submit">Giriş Yap</button>
      <div class="error" id="authError" role="alert"></div>
      <p class="privacy-note">Veriler bu sürümde yalnızca bu cihazdaki çalışma alanında saklanır. Sunucu senkronizasyonu sonraki altyapı aşamasıdır.</p>
    </form>
  </section>

  <section class="app" id="app" hidden>
    <aside class="side" id="sidebar" aria-label="Ana menü">
      <div class="side-brand"><div class="logo light">Yapı<span>360</span></div><button class="side-close" id="sideClose" aria-label="Menüyü kapat">×</button></div>
      <div class="company-card"><span class="company-icon">▦</span><div><small>AKTİF FİRMA</small><strong id="sideCompany"></strong></div></div>
      <nav id="nav"></nav>
      <div class="side-footer">
        <div class="workspace-status"><span>✓</span><div><strong>Çalışma alanı etkin</strong><small id="storageStatus">Yerel kayıt</small></div></div>
        <button class="logout-wide" id="logoutBtn">↪ Çıkış Yap</button>
      </div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop"></div>

    <main class="main">
      <header class="top">
        <div class="top-actions">
          <button class="icon-btn mobile-toggle" id="menuToggle" aria-label="Menüyü aç">☰</button>
          <div><div class="eyebrow">YAPI360 ÇALIŞMA ALANI</div><h1 id="pageTitle">Yönetim Paneli</h1></div>
        </div>
        <div class="top-actions">
          <button class="btn gold install" id="installBtn">Uygulamayı Yükle</button>
          <span class="user-chip" id="userChip"></span>
        </div>
      </header>
      <p class="page-description" id="pageDescription"></p>
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </section>

  <div class="modal" id="recordModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal-card" id="recordForm">
      <div class="modal-head"><h2 id="modalTitle">Yeni Kayıt</h2><button type="button" class="close" id="closeModal" aria-label="Kapat">×</button></div>
      <div class="form-grid" id="recordFields"></div>
      <div class="modal-actions"><button class="btn ghost" type="button" id="cancelModal">Vazgeç</button><button class="btn" type="submit">Kaydet</button></div>
    </form>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="./data.js?v=4.1.0"></script>
  <script src="./app.js?v=4.1.0"></script>
</body>
</html>
